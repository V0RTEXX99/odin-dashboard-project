<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">

   <link rel="stylesheet" href="styles.css">

   <title>Dashboard</title>
</head>

<body>

   <div class="container">

      <div class="header-container">

         <div class="search-container">

            <div class="search-bar">
               <img class="search-icon" src="icons/header/search-icon.svg" alt="">
               <input type="text">
            </div>

            <div class="profile-bar">
               <img class="notification-icon" src="icons/header/bell-ring-notification-icon.svg" alt="">
               <img class="profile-image" src="images/profile-image-1.jpg" alt="">
               <div>Aayan Iqbal</div>
            </div>

         </div>

         <div class="nav-container">

            <div class="greeting-bar">
               <img src="images/profile-image-1.jpg" alt="">
               <div class="greeting-message-container">
                  <p>Hi there,</p>
                  <p>Aayan Iqbal (@aayan)</p>
               </div>
            </div>

            <div class="nav-bar">
               <button>New</button>
               <button>Upload</button>
               <button>Share</button>
            </div>

         </div>

      </div>

      <div class="sidebar-container">

         <div class="sidebar-header">

            <img src="icons/sidebar/dashboard-icon.svg" alt="">
            <div>Dashboard</div>

         </div>

         <div class="sidebar-nav">
            <div class="home">
               <img src="icons/sidebar/home-icon.svg" alt="">
               <div>Home</div>
            </div>
            <div class="profile">
               <img src="icons/sidebar/profile-card-icon.svg" alt="">
               <div>Profile</div>
            </div>
            <div class="messages">
               <img src="icons/sidebar/messages-icon.svg" alt="">
               <div>Messages</div>
            </div>
            <div class="history">
               <img src="icons/sidebar/history-icon.svg" alt="">
               <div>History</div>
            </div>
            <div class="tasks">
               <img src="icons/sidebar/tasks-icon.svg" alt="">
               <div>Tasks</div>
            </div>
            <div class="communities">
               <img src="icons/sidebar/communities-icon.svg" alt="">
               <div>Communities</div>
            </div>
         </div>

         <div class="sidebar-util">
            <div class="settings">
               <img src="icons/sidebar/settings-icon.svg" alt="">
               <div>Settings</div>
            </div>
            <div class="support">
               <img src="icons/sidebar/support-icon.svg" alt="">
               <div>Support</div>
            </div>
            <div class="privacy">
               <img src="icons/sidebar/privacy-icon.svg" alt="">
               <div>Privacy</div>
            </div>
         </div>

      </div>

      <div class="main-content-container">

      </div>
   </div>


</body>

</html>
